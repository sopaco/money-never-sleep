<svg xmlns="http://www.w3.org/2000/svg" width="792" height="476" viewBox="0 0 792 476" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
  <rect width="792" height="476" fill="#ffffff"/>

  <!-- 三腿构成 -->
  <text x="24" y="30" font-size="11" fill="#8b94a6">风险资产只有三条腿，内部占比由 allocation.* 决定</text>

  <rect x="24" y="48" width="409.2" height="40" rx="5" fill="#1a5ce0"/>
  <rect x="437.2" y="48" width="182" height="40" fill="#4a80e8"/>
  <rect x="623.2" y="48" width="144.8" height="40" rx="5" fill="#7ba3ef"/>

  <g fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="228.6" y="73">美股宽基 55%</text>
    <text x="528.2" y="73">A股宽基 25%</text>
    <text x="695.6" y="73">逆周期 20%</text>
  </g>
  <g fill="#5b6577" font-size="9.5" text-anchor="middle">
    <text x="228.6" y="106">标普 500 · 纳指 100</text>
    <text x="528.2" y="106">沪深 300 · 中证 A500</text>
    <text x="695.6" y="106">黄金等</text>
  </g>

  <line x1="24" y1="130" x2="768" y2="130" stroke="#edf1f7"/>

  <!-- 偏离带 -->
  <text x="24" y="160" font-size="13" fill="#131a2a" font-weight="600">偏离带按腿判定：只有超带的腿才动</text>
  <text x="768" y="160" font-size="10.5" fill="#8b94a6" text-anchor="end">示例：目标风险仓位 80%，带宽 ±4pp</text>
  <text x="160" y="184" font-size="10" fill="#8b94a6">各腿占总资产的比例</text>

  <!-- 第一行：美股，带内 -->
  <text x="24" y="238" font-size="11.5" fill="#131a2a">美股宽基</text>
  <text x="24" y="254" font-size="10" fill="#8b94a6">目标 44.0%</text>
  <rect x="160" y="233" width="520" height="8" rx="4" fill="#f0f3f8"/>
  <rect x="576" y="225" width="83.2" height="24" rx="4" fill="#e8f0ff"/>
  <line x1="617.6" y1="221" x2="617.6" y2="253" stroke="#1a5ce0" stroke-width="2"/>
  <circle cx="591.6" cy="237" r="5" fill="#ffffff" stroke="#8b94a6" stroke-width="2"/>
  <text x="688" y="234" font-size="10.5" fill="#5b6577">偏离 −2.5pp</text>
  <text x="688" y="250" font-size="10.5" fill="#8b94a6">带内，不动</text>

  <!-- 第二行：A股，超带 -->
  <text x="24" y="308" font-size="11.5" fill="#131a2a">A股宽基</text>
  <text x="24" y="324" font-size="10" fill="#8b94a6">目标 20.0%</text>
  <rect x="160" y="303" width="520" height="8" rx="4" fill="#f0f3f8"/>
  <rect x="326.4" y="295" width="83.2" height="24" rx="4" fill="#fff3d6"/>
  <line x1="368" y1="291" x2="368" y2="323" stroke="#9a5b00" stroke-width="2"/>
  <circle cx="295.2" cy="307" r="5" fill="#ffffff" stroke="#c42b1c" stroke-width="2"/>
  <text x="688" y="304" font-size="10.5" fill="#c42b1c" font-weight="600">偏离 −7.0pp</text>
  <text x="688" y="320" font-size="10.5" fill="#c42b1c">超带，买入</text>

  <!-- 第三行：逆周期，带内 -->
  <text x="24" y="378" font-size="11.5" fill="#131a2a">逆周期</text>
  <text x="24" y="394" font-size="10" fill="#8b94a6">目标 16.0%</text>
  <rect x="160" y="373" width="520" height="8" rx="4" fill="#f0f3f8"/>
  <rect x="284.8" y="365" width="83.2" height="24" rx="4" fill="#e8f0ff"/>
  <line x1="326.4" y1="361" x2="326.4" y2="393" stroke="#1a5ce0" stroke-width="2"/>
  <circle cx="319.1" cy="377" r="5" fill="#ffffff" stroke="#8b94a6" stroke-width="2"/>
  <text x="688" y="374" font-size="10.5" fill="#5b6577">偏离 −0.7pp</text>
  <text x="688" y="390" font-size="10.5" fill="#8b94a6">带内，不动</text>

  <!-- 刻度 -->
  <g font-size="9" fill="#b9c4d4" text-anchor="middle">
    <text x="160" y="418">0</text>
    <text x="264" y="418">10</text>
    <text x="368" y="418">20</text>
    <text x="472" y="418">30</text>
    <text x="576" y="418">40</text>
    <text x="680" y="418">50%</text>
  </g>

  <text x="24" y="450" font-size="10" fill="#8b94a6">浅蓝／浅黄块是每条腿的容差带；竖线是目标，圆点是当前。带内不动是刻意的：频繁微调只增加成本。</text>
  <text x="24" y="468" font-size="10" fill="#8b94a6">只补超带的腿，所以总仓位不会一次回到目标——执行后仍可能低于目标几个百分点。</text>
</svg>
