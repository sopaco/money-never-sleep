[package]
name = "money-never-sleep"
version = "0.8.0"
edition = "2024"
description = "AI-Powered Contrarian Investment Decision Assistant"
license = "MIT"

[lib]
name = "money_never_sleep"
path = "src/lib.rs"

[[bin]]
name = "mns"
path = "src/main.rs"

# P0 desktop shell. Kept behind a feature so the CLI builds and tests exactly
# as before: `cargo run --bin mns-gui --features gui`.
[[bin]]
name = "mns-gui"
path = "src/bin/mns-gui.rs"
required-features = ["gui"]

# Standalone CHM-style help viewer opened from the MNS tray menu.
#   cargo run --bin mns-help --features gui
[[bin]]
name = "mns-help"
path = "src/bin/mns-help.rs"
required-features = ["gui"]

# Headless verification of the ACP chain used by the GUI:
#   cargo run --example agent_smoke --features agent
[[example]]
name = "agent_smoke"
path = "examples/agent_smoke.rs"
required-features = ["agent"]

[features]
default = []
# ACP external-agent runtime. No inference endpoint / API key lives here.
agent = ["dep:agent-client-protocol"]
# GPUI Kit desktop + native tray. Implies the agent runtime.
gui = ["agent", "dep:gpui-kit", "dep:gpui-tray"]
# Headless GPUI layout tests (`cargo test --features gui-test`).
#
# Enable test support on gpui-pre (the engine behind gpui-kit) rather than
# `gpui-kit/test-support`: the kit's feature also activates its optional
# gpui-fast sibling, which needs taffy =0.15.0 while gpui-pre locks 0.15.1 —
# Cargo forbids two semver-compatible versions, so the kit's feature cannot
# resolve against gpui-pre at all.
gui-test = ["gui", "gpui-pre/test-support"]

[target.'cfg(windows)'.build-dependencies]
# 把 assets/app.ico 编成 exe 的 RT_GROUP_ICON #1 资源。GPUI 的 Windows 后端
# 用 LoadImageW(GetModuleHandleW(None), MAKEINTRESOURCE(1)) 取标题栏/任务栏图标，
# 没有资源时只能显示 Windows 默认图标（WindowOptions::icon 仅对 X11 生效）。
winresource = "0.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
dirs = "6"
anyhow = "1"
unicode-width = "0.2"

# --- P0: external ACP agent -------------------------------------------------
# `process` is required for AcpAgent (spawns the external CLI over stdio).
agent-client-protocol = { version = "5.0", features = ["process"], optional = true }

# --- P0: GPUI Kit desktop shell ---------------------------------------------
# gpui-kit 0.9.0 pins gpui-pre =0.3.11; gpui-tray's `gpui-kit` backend allows
# ^0.3.4, so Cargo unifies both on a single gpui-pre instance (shared types).
gpui-kit = { version = "0.9.0", optional = true }
gpui-tray = { version = "0.3.0", optional = true, default-features = false, features = ["gpui-kit", "menu-state"] }
# Only used to turn on `gpui-pre/test-support` for headless layout tests; the
# version range matches gpui-kit's own pin so Cargo unifies both.
gpui-pre = { version = "0.3", optional = true, default-features = false }
