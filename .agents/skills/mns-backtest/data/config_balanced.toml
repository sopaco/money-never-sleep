# 多资产平衡配置 - 三种资产均衡配置
[settings]
annualized_target_high = 15.0
min_holding_days = 21
max_contrarian_weight = 3.0
report_output_dir = "./reports"

[allocation]
us_stocks = 33.0
cn_stocks = 33.0
counter_cyclical = 34.0

[thresholds]
extreme_fear = 30.0
fear = 45.0
neutral = 55.0
greed = 70.0

# 三资产均衡 → 目标权重曲线也更平缓(spread 30pp，默认曲线 spread 50pp)，
# 不追求极端仓位切换。驱动 mns report/默认回测引擎的是这一段。
[target_weight]
extreme_fear = 75.0
fear = 68.0
neutral = 60.0
greed = 52.0
extreme_greed = 45.0

[rebalance]
band_pp = 4.0
min_trade_amount = 500.0
min_holding_days_for_sell = 30

[api]
fear_greed_url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
