# 波段交易配置 - 更频繁的买入卖出
[settings]
annualized_target_low = 8.0
annualized_target_high = 12.0
min_holding_days = 14         # 更短的最小持仓天数
min_absolute_profit_days = 45
max_contrarian_weight = 2.0
report_output_dir = "./reports"

[allocation]
us_stocks = 60.0
cn_stocks = 25.0
counter_cyclical = 15.0

[thresholds]
extreme_fear = 25.0
fear = 42.0
neutral = 58.0
greed = 72.0

# 波段操作靠更窄的偏离带([rebalance] 里的 band_pp)驱动高频交易，目标权重曲线本身适中。
# 驱动 mns report/默认回测引擎的是这一段，不是下面的 buy_ratio。
[target_weight]
extreme_fear = 80.0
fear = 72.0
neutral = 62.0
greed = 48.0
extreme_greed = 38.0

[rebalance]
band_pp = 2.0                 # 更窄的偏离带：这才是"更频繁买卖"的真正机制
min_trade_amount = 500.0
min_holding_days_for_sell = 14

# 下面 [buy_ratio]/[sell_ratio] 仅供"旧框架"(Engine::Legacy)对比使用，对 mns report 无效。
[buy_ratio]
extreme_fear = 70.0
fear = 45.0
neutral = 15.0                # 中性也买入
greed = 0.0

[sell_ratio]
extreme_greed_target_high = 60.0
extreme_greed_target_low = 40.0
extreme_greed_below_target = 25.0
greed_target_high = 45.0
greed_target_low = 30.0
neutral_target_high = 25.0    # 中性也减仓

[api]
fear_greed_url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
