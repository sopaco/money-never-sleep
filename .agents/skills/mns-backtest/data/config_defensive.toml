# 防御配置 - 低回撤优先
# 目标：最小化回撤，稳健收益

[settings]
annualized_target_low = 10.0
annualized_target_high = 15.0
min_holding_days = 45        # 更长持仓
min_absolute_profit_days = 120
max_contrarian_weight = 2.0
report_output_dir = "./reports"

[allocation]
us_stocks = 55.0             # 降低美股
cn_stocks = 25.0             # 提高红利低波
counter_cyclical = 20.0     # 提高黄金

[thresholds]
extreme_fear = 30.0          # 更严格的极度恐慌
fear = 45.0
neutral = 55.0
greed = 70.0                 # 更早卖出

# 风险资产目标权重曲线——驱动 mns report 与默认回测引擎(Engine::TargetWeight)的真正参数。
# 与 AppConfig::default_config() 的 TargetWeight::default_curve() 完全一致：本文件就是当前默认值。
[target_weight]
extreme_fear = 85.0
fear = 75.0
neutral = 60.0
greed = 45.0
extreme_greed = 35.0

[rebalance]
band_pp = 4.0                 # 偏离带：与默认一致
min_trade_amount = 500.0
min_holding_days_for_sell = 30

# 下面 [buy_ratio]/[sell_ratio] 仅供"旧框架"(Engine::Legacy，回测对比表里的
# "旧框架(现金比例)"一行)及 calculate_buy_suggestions/calculate_sell_suggestions 使用。
# mns report 与默认回测引擎完全不读这两段——改这里对实盘建议没有任何影响。
[buy_ratio]
extreme_fear = 60.0
fear = 35.0
neutral = 0.0
greed = 0.0

[sell_ratio]
extreme_greed_target_high = 50.0
extreme_greed_target_low = 30.0
extreme_greed_below_target = 20.0
greed_target_high = 40.0
greed_target_low = 25.0
neutral_target_high = 15.0

[api]
fear_greed_url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
