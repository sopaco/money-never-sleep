# 历史激进配置 - 基于历史回测数据拟合
# ⚠️ 免责声明：历史最优 ≠ 未来最优，过度拟合风险
# 此配置仅供研究参考，不建议直接用于实盘

[settings]
annualized_target_high = 22.0
min_holding_days = 21
max_contrarian_weight = 3.0
report_output_dir = "./reports"

[allocation]
# 提高美股权重，降低A股
us_stocks = 70.0        # 纳指+印度+日本
cn_stocks = 15.0        # 红利低波
counter_cyclical = 15.0 # 黄金（提高到15%）

[thresholds]
extreme_fear = 20.0     # 更低的极度恐慌阈值
fear = 40.0
neutral = 55.0
greed = 75.0

# ⚠️ 同样是拟合历史数据得出的目标权重曲线，spread 72pp(默认 50pp)——过拟合风险与上面的免责声明一致。
# 驱动 mns report/默认回测引擎的是这一段。
[target_weight]
extreme_fear = 92.0
fear = 80.0
neutral = 62.0
greed = 40.0
extreme_greed = 20.0

[rebalance]
band_pp = 3.0
min_trade_amount = 500.0
min_holding_days_for_sell = 21

[api]
fear_greed_url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
