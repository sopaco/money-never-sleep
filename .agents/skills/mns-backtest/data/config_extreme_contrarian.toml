# 极致逆向配置 - 最大化恐慌区间买入
[settings]
annualized_target_high = 12.0
min_holding_days = 21         # 缩短最小持仓天数
max_contrarian_weight = 3.0   # 提高逆向权重，更激进地加仓浮亏标的
report_output_dir = "./reports"

[allocation]
us_stocks = 50.0
cn_stocks = 30.0
counter_cyclical = 20.0

[thresholds]
extreme_fear = 30.0           # 收紧极度恐慌区间
fear = 45.0
neutral = 55.0
greed = 70.0                  # 提前进入贪婪区间

# 最大化恐慌区间买入、贪婪区间快速减仓 → 目标权重曲线 spread 65pp（默认 50pp）。
# 驱动 mns report/默认回测引擎的是这一段。
[target_weight]
extreme_fear = 90.0
fear = 78.0
neutral = 60.0
greed = 42.0
extreme_greed = 25.0

[rebalance]
band_pp = 3.0                 # 更窄的偏离带：更快跟上目标仓位
min_trade_amount = 500.0
min_holding_days_for_sell = 21

[api]
fear_greed_url = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
